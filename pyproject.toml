[project]
name = "robot-brain"
version = "0.1.0"
description = "Pluggable L3 cognition skeleton for a robot"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "langgraph>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robot_brain*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
