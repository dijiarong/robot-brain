[project]
name = "robot-brain"
version = "0.1.0"
description = "Pluggable L3 cognition skeleton for a robot"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "langgraph>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
grpc = ["grpcio>=1.60"]
grpc-dev = ["grpcio>=1.60", "grpcio-tools>=1.60"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
unitree-sdk = ["unitree_sdk2_python @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git"]
unitree-webrtc = ["unitree-webrtc-connect>=2.1", "websockets>=12.0"]
unitree = [
    "unitree-webrtc-connect>=2.1",
    "unitree_sdk2_python @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git",
]

[project.scripts]
robot-brain-service = "robot_brain.service.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robot_brain*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
