[project]
name = "robot-brain"
version = "0.1.0"
description = "Pluggable L3 cognition skeleton for a robot"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "langgraph>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
grpc = ["grpcio>=1.60"]
grpc-dev = ["grpcio>=1.60", "grpcio-tools>=1.60"]
# Local VLM passability hint (iteration 17): multimodal HTTP client + image
# encoding. Only needed when RDB_VLM_ENABLED=true.
vlm = ["httpx>=0.27", "Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # VLM test deps (test_vlm_client / test_passability_analyzer / test_explore_vlm
    # need httpx + Pillow; test_go2_frame_source needs av + numpy).
    "httpx>=0.27",
    "Pillow>=10.0",
    "av>=12.0",
    "numpy>=1.26",
]
unitree-sdk = ["unitree_sdk2_python @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git"]
unitree-webrtc = ["unitree-webrtc-connect>=2.1", "websockets>=12.0"]
unitree = [
    "unitree-webrtc-connect>=2.1",
    "unitree_sdk2_python @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git",
]

[project.scripts]
robot-brain-service = "robot_brain.service.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robot_brain*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Generated gRPC/protobuf stubs (from robot_brain/control/proto/*.proto) must
# not be linted or hand-edited.
extend-exclude = ["robot_brain/control/generated"]
